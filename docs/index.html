    <script>
      // Automatic detection for GitHub Pages root deployment fallback
      // When deployed directly to GitHub Pages without a build step, redirect to the pre-bundled /docs/ directory
      (function() {
        var isGitHubPages = window.location.hostname.endsWith('github.io');
        var isNotDocs = !window.location.pathname.includes('/docs');
        var scripts = document.getElementsByTagName('script');
        var hasUncompiledSource = false;
        for (var i = 0; i < scripts.length; i++) {
          if (scripts[i].src && (scripts[i].src.indexOf('.tsx') !== -1 || scripts[i].src.indexOf('/src/') !== -1)) {
            hasUncompiledSource = true;
            break;
          }
        }
        if (isGitHubPages && isNotDocs && hasUncompiledSource) {
          var basePath = window.location.pathname.replace(/\/index\.html$/, '');
          if (!basePath.endsWith('/')) basePath += '/';
          window.location.replace(basePath + 'docs/' + window.location.search + window.location.hash);
        }
      })();
    </script>
