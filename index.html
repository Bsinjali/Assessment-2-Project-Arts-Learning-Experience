<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arts Learning Experience | Early Childhood Education</title>
    <meta name="description" content="A comprehensive, research-based educational hub for Early Childhood Education integrating Music, Visual Arts, Dance, Media Arts, and Drama with EYLF curriculum outcomes and Bloom's Taxonomy assessment." />
    <meta property="og:title" content="Arts Learning Experience | Early Childhood Education" />
    <meta property="og:description" content="A comprehensive, research-based educational hub for Early Childhood Education integrating Music, Visual Arts, Dance, Media Arts, and Drama with EYLF curriculum outcomes and Bloom's Taxonomy assessment." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <script>
      // Ensure trailing slash on GitHub Pages so relative asset paths (./assets/...) always resolve to the repository directory
      if (window.location.hostname.endsWith('github.io') && !window.location.pathname.endsWith('/') && !window.location.pathname.includes('.')) {
        window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Branded loading fallback while React bundle initializes -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #fafaf9; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: #1c1917; padding: 24px; text-align: center;">
        <div style="width: 44px; height: 44px; border: 3px solid #e7e5e4; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px;"></div>
        <h1 style="font-size: 20px; font-weight: 800; margin: 0 0 8px 0; color: #1c1917; letter-spacing: -0.02em;">ARTS LEARNING EXPERIENCE</h1>
        <p style="font-size: 14px; color: #78716c; margin: 0; max-width: 420px; line-height: 1.5;">Early Childhood Education Curriculum Hub</p>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fallback for uncompiled repository root deployments on GitHub Pages:
      // If the app was deployed from the uncompiled repository root instead of the build artifact,
      // React will not mount; automatically redirect to the pre-bundled /docs/ directory after 1.2s.
      (function() {
        if (window.location.hostname.endsWith('github.io') && !window.location.pathname.includes('/docs')) {
          setTimeout(function() {
            var root = document.getElementById('root');
            if (root && !root.querySelector('main')) {
              var basePath = window.location.pathname.replace(/\/index\.html$/, '');
              if (!basePath.endsWith('/')) basePath += '/';
              window.location.replace(basePath + 'docs/' + window.location.search + window.location.hash);
            }
          }, 1200);
        }
      })();
    </script>
  </body>
</html>
